skill_id: "set_gripper_width"
name: "Set Gripper Width"
description: "Set a validated Robotiq width; a real command is blocked until exact trusted human confirmation"
parameters:
  - name: "width_m"
    type: "float"
    required: true
    min_value: 0.0
    max_value: 0.14
  - name: "speed_mps"
    type: "float"
    required: false
    default: 0.02
  - name: "force_N"
    type: "float"
    required: false
    default: 10.0
preconditions:
  - "gripper_available"
effects:
  - "gripper_width_changed"
execution:
  backend_method: "set_gripper_width"
