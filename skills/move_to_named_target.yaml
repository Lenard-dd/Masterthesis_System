skill_id: "move_to_named_target"
name: "Move to Named Target"
description: "Move the robot arm to a predefined named position"
parameters:
  - name: "target_name"
    type: "string"
    required: true
    allowed_values: ["home", "observe"]
  - name: "velocity_scale"
    type: "float"
    required: false
    default: 0.03
    min_value: 0.0
    max_value: 0.1
  - name: "acceleration_scale"
    type: "float"
    required: false
    default: 0.03
    min_value: 0.0
    max_value: 0.1
preconditions: []
effects:
  - "robot_at_target"
execution:
  backend_method: "move_to_named_target"
