skill_id: "close_gripper"
name: "Close Gripper"
description: "Safely close the Robotiq 2F-140 to a bounded width; real hardware requires trusted human confirmation"
parameters:
  - name: "width_m"
    type: "float"
    required: false
    default: 0.04
    min_value: 0.0
    max_value: 0.14
  - name: "speed_mps"
    type: "float"
    required: false
    default: 0.02
  - name: "force_N"
    type: "float"
    required: false
    default: 10.0
preconditions:
  - "gripper_available"
effects:
  - "gripper_closed"
execution:
  backend_method: "close_gripper"
