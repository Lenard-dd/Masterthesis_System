skill_id: "open_gripper"
name: "Open Gripper"
description: "Open the Robotiq 2F-140 within hardware limits; real hardware requires trusted human confirmation"
parameters:
  - name: "width_m"
    type: "float"
    required: false
    default: 0.14
    min_value: 0.0
    max_value: 0.14
  - name: "speed_mps"
    type: "float"
    required: false
    default: 0.02
  - name: "force_N"
    type: "float"
    required: false
    default: 10.0
preconditions:
  - "gripper_available"
effects:
  - "gripper_open"
execution:
  backend_method: "open_gripper"
