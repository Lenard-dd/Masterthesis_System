hardware_mode:
  mode: real_full_grasp_supervised

  camera:
    enabled: true
    type: d435i

  sam3:
    enabled: true
    execution: conda_subprocess
    conda_env: sam3

  graspgenx:
    enabled: true
    execution: conda_subprocess
    conda_env: graspgenx

  arm:
    real_arm_enabled: true
    allow_arm_execution: true
    execution_mode: full_grasp_supervised
    allow_moveit_execution: true
    allow_rviz_fake_execution: true
    allow_plan_only: true
    require_human_confirmation: true

  gripper:
    real_gripper_enabled: true
    allow_gripper_execution: true
    allow_contact_close: true
    require_human_confirmation: true
    max_width_m: 0.14
    min_width_m: 0.0
    safe_close_width_m: 0.04
    max_force_N: 20.0
    max_speed_mps: 0.03
