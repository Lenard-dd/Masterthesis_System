# Independent tabletop guard for the real supervised grasp demo.
#
# This does NOT change RViz, MoveIt, the shared URDF, or its collision model.
# MoveIt continues to collision-check the complete planned trajectory. These
# values add a calibrated gripper-contact target/approach screen before real
# execution.
tabletop_safety:
  enabled: true
  frame: base_link
  # Plane measured by ros-tabletop-calibration on 2026-07-14:
  # 0.001094*x + 0.012499*y + 0.999921*z - 0.001792 = 0
  plane:
    normal: {x: 0.0010942130, y: 0.0124989139, z: 0.9999211287}
    d: -0.0017921438

  # Relative placements on the tabletop use this calibrated plane to compute
  # support height at the destination XY. If calibration is unavailable, a
  # declared flat-table fallback preserves the picked object's original Z.
  relative_place_support:
    use_calibrated_plane: true
    flat_table_fallback: true
    # Fail closed when the localized object bottom disagrees strongly with
    # the calibrated support plane; this catches stale TF or bad dimensions.
    max_source_support_error_m: 0.03

  # Local point from MoveIt's tool0 to the Robotiq grasp/fingertip region.
  # 0.004 m tool0-to-mount + approximately 0.195 m gripper-base-to-contact.
  # The vector is rotated by each candidate's tool0 orientation before the
  # table-plane distance is evaluated.
  tool0_to_grasp_contact_m: [0.0, 0.0, 0.199]

  # The Robotiq fingertips advance approximately 25 mm along the approach axis
  # while moving from open to closed. Back the final target away by 40 mm:
  # 25 mm kinematic compensation plus approximately 15 mm residual clearance.
  # All corrected poses are replanned and revalidated.
  grasp_contact_backoff_m: 0.040

  # Measured open-to-closed fingertip travel along the forward approach axis.
  # Safety validation checks the endpoint of this sweep, including tilted
  # candidates, instead of treating it as a fixed table-normal distance.
  finger_axial_close_sweep_m: 0.025

  # A smaller nut requires the Robotiq fingers to close farther.  The lowest
  # occupied finger/link point then sits below the nominal grasp contact point.
  # These conservative measured-width tiers are added to the table clearance;
  # the pose is lifted only by the remaining amount needed to satisfy it.
  narrow_grasp_clearance_tiers:
    - {max_width_m: 0.012, extra_clearance_m: 0.012}
    - {max_width_m: 0.015, extra_clearance_m: 0.008}
    - {max_width_m: 0.030, extra_clearance_m: 0.005}

  # Sample both Robotiq finger-pad collision boxes throughout closing.  The
  # lowest transformed corner, rather than the nominal contact centre, owns
  # the table-clearance correction.
  robotiq_2f_140_finger_envelope:
    enabled: true
    tool0_to_gripper_base_m: [0.0, 0.0, 0.004]
    joint_min_rad: 0.0
    joint_max_rad: 0.70
    joint_samples: 15
    extra_clearance_m: 0.005
    # Larger corrections risk lifting the fingers above a thin object's usable
    # side surface; reject that candidate and try another one instead.
    max_auto_lift_m: 0.016
    # For very small screws/nuts, never execute a candidate whose complete
    # closing envelope still needs more correction than the bounded lift.
    # Wider objects retain the permissive capped correction used in testing.
    narrow_hard_reject_width_m: 0.012
    # The full 0..0.70 rad proxy is deliberately conservative and previously
    # rejected every GraspGenX candidate. Use it to request a bounded lift;
    # keep the calibrated contact-point and MoveIt checks as the hard gates.
    hard_reject: false

  # Base allowance covering the measured plane residual (~4.8 mm), depth/TF
  # noise and a small remaining physical margin.
  collision_margin_m: 0.008
  clearance:
    pregrasp_m: 0.020
    grasp_m: 0.005
    retreat_m: 0.020

  # Optional clearance in addition to the explicitly modelled 25 mm sweep.
  # Keep this at zero unless repeatability measurements justify more margin;
  # collision_margin_m and clearance.grasp_m already provide 13 mm together.
  close_sweep_compensation_m: 0.000

  # Prefer near-normal tabletop approaches.  The workcell does not require
  # pronounced side grasps for its intended objects, so reject candidates
  # whose pregrasp-to-grasp approach tilts more than 25 degrees from the
  # calibrated table normal.
  max_approach_tilt_deg: 25.0
