# Independent tabletop guard for the real supervised grasp demo.
#
# This does NOT change RViz, MoveIt, the shared URDF, or its collision model.
# MoveIt continues to collision-check the complete planned trajectory. These
# values add a calibrated TCP target/approach screen before real execution.
tabletop_safety:
  enabled: true
  frame: base_link
  # Plane measured by ros-tabletop-calibration on 2026-07-14:
  # 0.001094*x + 0.012499*y + 0.999921*z - 0.001792 = 0
  plane:
    normal: {x: 0.0010942130, y: 0.0124989139, z: 0.9999211287}
    d: -0.0017921438

  # Original conservative TCP-only settings used before finger-envelope
  # collision sampling was introduced.
  collision_margin_m: 0.012
  clearance:
    pregrasp_m: 0.040
    grasp_m: 0.025
    retreat_m: 0.040

  # Additional TCP clearance for the final grasp. This affects validation
  # only; it does not alter the generated grasp pose.
  close_sweep_compensation_m: 0.010

  # Keep the original near-normal tabletop approach restriction.
  max_approach_tilt_deg: 20.0
