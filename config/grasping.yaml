grasping:
  # End-effector clearance above the calculated object placement centre.
  # This is intentionally below the restricted real-arm approach limit.
  place_motion:
    approach_height_m: 0.05
    # For inside placement, keep the calibrated Robotiq grasp/contact region
    # above the detected rim throughout release.  This deliberately produces
    # a short drop for small containers instead of inserting the fingers.
    tool0_to_grasp_contact_m: [0.0, 0.0, 0.199]
    inside_contact_clearance_above_rim_m: 0.04
    # Object-centre to tool0 offset is preserved at placement.  With the
    # Robotiq/tool0 frame used here, valid reviewed grasps can be about 0.23 m
    # from an object's localized centre; keep a bounded allowance instead of
    # rejecting them before MoveIt can preview the place path.
    max_grasp_offset_m: 0.30
  point_cloud:
    output_dir: data/grasping/point_clouds
    depth_scale: 0.001
    min_depth_m: 0.05
    max_depth_m: 2.0
    max_points: 50000
    # Save the same aligned RGB-D frame as a full cloud and as an environment
    # cloud with the selected SAM3 target removed. GraspGenX generates from the
    # target cloud and collision-filters against the environment cloud.
    scene_cloud_enabled: true
    scene_max_points: 30000
    # Keep nearby support-surface points for small parts. A wide dilation made
    # elevated platforms disappear from the environment cloud.
    scene_target_mask_dilation_px: 1
    # Fill the support plane hidden by the selected object's mask. This avoids
    # an object-shaped false free-space hole in a single-view depth cloud.
    scene_support_completion_enabled: true
    scene_support_max_points: 3000
    # Estimate thickness from a local tabletop plane around the SAM3 mask.
    # The estimate is accepted only when RANSAC finds a stable enough plane.
    table_plane_enabled: true
    table_plane_margin_px: 24
    table_plane_min_points: 250
    table_plane_max_points: 12000
    table_plane_ransac_iterations: 120
    table_plane_inlier_threshold_m: 0.005
    table_plane_min_inlier_ratio: 0.65
    height_percentile: 90.0
    min_height_m: 0.003
    max_height_m: 0.25

  graspgenx_subprocess:
    enabled: true
    conda_env: graspgenx
    conda_executable: conda
    runner_script: scripts/graspgenx_zmq_runner.py
    timeout_sec: 120.0
    output_dir: data/grasping/graspgenx_outputs
    server_host: localhost
    server_port: 5556
    gripper_name: robotiq_2f_140
    # Prefer GraspMoE's top-down OBB sparse branch for tabletop objects.
    # The project server extension is needed; the upstream server keeps the
    # diffusion fallback, with the actual strategy recorded in metadata.
    strategy: sparse
    sparse_quota: 24
    moe_num_yaws: 36
    # Negative OBB offsets can place a grasp inside the table for thin parts.
    # GraspMoE ranks all yaw/height combinations together, so the old -2,0
    # setting could fill the whole sparse quota with the unsafe -2 cm layer.
    moe_z_offsets_cm: "0"
    num_grasps: 200
    grasp_threshold: -1.0
    topk_num_grasps: 100
    timeout_ms: 60000
    estimate_gripper_width: true
    # GraspGenX robotiq_2f_140 grasp_volume opens along local X.
    width_axis_index: 0
    width_clearance_m: 0.01
    # Official GraspGenX gripper-mesh filtering against the D435i environment
    # cloud. Existing tabletop-envelope and MoveIt checks remain active.
    scene_collision_enabled: true
    scene_collision_threshold_m: 0.006
    scene_collision_samples: 2500
    scene_collision_batch_size: 4
    # In addition to GraspGenX's static/open collision mesh, check the actual
    # closed Robotiq surface point cloud at the same candidate pose. This
    # covers the changed fingertip location without translating the palm.
    scene_collision_closed_finger_enabled: true
    scene_collision_closed_finger_samples: 3500
    # Keep 6.5 mm around discrete non-planar scene points. The independently
    # estimated local support plane retains an 11 mm clearance below so tabletop
    # protection remains separate from small-object point-cloud noise.
    scene_collision_closed_finger_threshold_m: 0.0065
    # Retained for the legacy one-pose collision path. Constrained generation
    # below searches the final backoff per candidate.
    scene_collision_closed_finger_backoff_m: 0.040
    environment_constrained_generation:
      enabled: true
      min_backoff_m: 0.025
      max_backoff_m: 0.050
      # Finer insertion-depth search reduces quantization error without another
      # model inference; 2.5 mm gives eleven trials across the calibrated range.
      backoff_step_m: 0.0025
      min_target_contact_points: 12
      min_target_contact_fraction: 0.20
      # Require target evidence in the distal finger-pad slice, rather than
      # anywhere inside the broad nominal grasp volume.
      pad_contact_depth_m: 0.045
      # Estimate the closest horizontal support from the local scene cloud and
      # analytically check the closed gripper surface against that plane.
      support_plane_enabled: true
      support_plane_margin_m: 0.012
      support_plane_clearance_m: 0.011
      support_plane_inlier_threshold_m: 0.003
      support_plane_max_tilt_deg: 20.0
      support_plane_min_inliers: 24
      pregrasp_distance_m: 0.060
      retreat_distance_m: 0.100
      path_samples: 5
      path_surface_samples: 1800
      # Apply the 24-candidate limit only after environment checks. Preserve
      # alternatives across planar yaw instead of returning many near-duplicates.
      yaw_bin_deg: 15.0
      max_per_yaw_bin: 2
      # Preserve enough simple vertical candidates before high-score diffusion
      # candidates consume the final environment-safe quota.
      min_obb_candidates: 12
    # Scene collision is a safety requirement in this mode. Stop instead of
    # silently returning object-only candidates when the API/assets fail.
    scene_collision_fallback_to_object_only: false
    # On small GPUs, run SAM3 detection first, then start/confirm the
    # GraspGenX server before candidate generation to avoid VRAM contention.
    require_server_confirmation: true

  plan_only_preview:
    # Must not exceed real_arm_safety.limits.max_approach_distance_m: the
    # pregrasp-to-grasp segment is later executed as one supervised approach.
    pregrasp_distance_m: 0.06
    retreat_distance_m: 0.10
    # Interpret retreat_vector after TF and tool0 conversion, in the final
    # MoveIt target frame. With target_frame=base_link, [0, 0, 1] means lift up
    # from the grasp pose instead of moving along the camera optical +Z axis.
    retreat_vector_frame: target_frame
    retreat_vector: [0.0, 0.0, 1.0]
    sequence_replanning_attempts: 1
    velocity_scale: 0.10
    acceleration_scale: 0.10
    moveit:
      # Use Pilz for deterministic industrial-style grasp motion:
      #   PTP: joint-space move to pregrasp
      #   LIN: Cartesian straight-line approach and retreat
      # This avoids random OMPL wrist-wrap solutions for short grasp motions.
      pipeline_id: pilz_industrial_motion_planner
      planner_id: PTP
      stage_planner_ids:
        pregrasp: PTP
        grasp: LIN
        retreat: LIN
      num_planning_attempts: 1
      allowed_planning_time_sec: 6.0
      service_timeout_sec: 10.0
    # GraspGenX score alone does not guarantee that the UR5 can reach the
    # candidate from its current joint state. Before previewing the full
    # pregrasp/grasp/retreat sequence, test the top candidates with MoveIt
    # plan-only requests and select one that is reachable and passes trajectory
    # validation. This avoids choosing visually plausible but high joint-wrap
    # candidates that create complex RViz paths or fail validation.
    candidate_screening:
      enabled: true
      # Symmetry normalization removes equivalent yaw pairs before this cap.
      max_candidates: 30
      sparse_screen_quota: 12
      variants: [full_pose, relaxed_orientation, position_only]
      position_tolerance_m: 0.01
      full_orientation_tolerance_rad: 0.05
      relaxed_orientation_tolerance_rad: 0.50
      allow_position_only_fallback: true
      grasp_preferences:
        enabled: true
        # A two-finger grasp is physically unchanged after a 180-degree turn
        # around its approach axis. Choose the representation closest to the
        # current wrist before MoveIt, and try the opposite only as fallback.
        parallel_jaw_symmetry_enabled: true
        # Plan the 180-degree equivalent only when the initially selected
        # trajectory would rotate wrist_3 by at least 120 degrees.
        symmetry_replan_wrist_threshold_rad: 2.09439510239
        wrist_rotation_weight: 2.0
        prefer_top_down: true
        # Keep candidate ranking aligned with the hard tabletop safety gate.
        max_tilt_deg: 25.0
        top_down_weight: 2.0
        # If a simple OBB top-down grasp is reachable, rank within that set;
        # use tilted diffusion candidates only as fallback.
        prefer_reachable_obb_top_down: true
        preferred_obb_max_tilt_deg: 2.0
        prefer_face_aligned_yaw: true
        max_face_yaw_deviation_deg: 25.0
        face_alignment_weight: 2.0
        prefer_current_gripper_yaw: true
        current_yaw_weight: 3.0
        max_preferred_yaw_change_deg: 90.0
        # Fixed Robotiq base-frame Y is the jaw closing direction. Using the
        # fixed base avoids finger-joint motion changing the reference axis.
        current_gripper_frame: "robotiq_140_base_link"
        current_gripper_axis: [0.0, 1.0, 0.0]
        current_gripper_tf_timeout_sec: 1.0
    # GraspGenX reports a grasp / Robotiq gripper frame. MoveIt plans for the
    # UR5 end-effector frame configured in config/ur5.yaml, normally tool0.
    #
    # Convention:
    #   T_base_ee = T_base_grasp * T_grasp_ee
    #
    # translation_m is expressed in the GraspGenX grasp frame, not base_link.
    # rotation_rpy_rad is roll/pitch/yaw from GraspGenX grasp frame to tool0.
    #
    # Source model:
    #   /home/lenard/dev_ws/src/ur_src/ur5_launcher/urdf/camera_mount.urdf.xacro
    #     tool0 -> camera_mount: xyz="0 0 0.004", rpy="0 0 0"
    #   /home/lenard/dev_ws/src/ur_src/ur5_launcher/urdf/ur5_with_gripper.urdf.xacro
    #   /home/lenard/dev_ws/src/ur_src/ros2_robotiq_gripper/robotiq_description/urdf/robotiq_2f_140_macro.urdf.xacro
    #     camera_mount -> robotiq base: xyz="0 0 0", rpy="0 0 pi/2"
    #
    # GraspGenX models jaw opening along local X, while the ROS Robotiq model
    # opens along robotiq_140_base_link local Y. The URDF's +90-degree fixed
    # joint maps that Y axis onto tool0 -X, which is the same undirected jaw
    # axis as GraspGenX +X. Therefore grasp and tool0 share planar orientation;
    # applying an additional -90 degrees would rotate the real jaws away from
    # the collision-checked direction. Only the 4 mm axial offset is inverted.
    grasp_frame_to_ee_frame:
      enabled: true
      translation_m: [0.0, 0.0, -0.004]
      rotation_rpy_rad: [0.0, 0.0, 0.0]
