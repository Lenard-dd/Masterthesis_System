perception:
  mode: d435i_sam3
  detector: sam3_subprocess
  min_confidence_default: 0.5
  # Keep SAM3's common candidate threshold permissive, then apply stricter
  # query-class thresholds in the RGB-D backend. This avoids reducing recall
  # for small screws and other classes when only nut detections need tuning.
  class_confidence_thresholds:
    nut: 0.70
  require_pose_for_pick: true
  target_frame: base_link
  require_base_link_pose_for_pick: true

d435i:
  rgb_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/camera/color/camera_info
  rgb_frame: camera_color_optical_frame
  depth_frame: camera_color_optical_frame
  wait_timeout_sec: 5.0
  runtime_dir: data/perception_runtime

sam3_subprocess:
  enabled: true
  conda_env: sam3
  conda_executable: conda
  runner_script: scripts/sam3_runner.py
  # Multi-object localization keeps one SAM3 worker alive. The worker loads
  # weights once and encodes each RGB image once before applying each text query.
  persistent_worker: true
  timeout_sec: 60.0
  output_dir: data/perception_outputs
  save_debug_overlay: true
  save_mask_images: true
  # SAM3 currently requires CUDA in this setup. To avoid VRAM contention on
  # 8GB GPUs, run SAM3 detection before starting the GraspGenX server, or stop
  # the GraspGenX server until object point-cloud generation finishes.
  device: cuda
  pytorch_cuda_alloc_conf: expandable_segments:True
  checkpoint_path: /home/lenard/.cache/huggingface/hub/models--facebook--sam3/snapshots/3c879f39826c281e95690f02c7821c4de09afae7/sam3.pt
  model_config: ""
