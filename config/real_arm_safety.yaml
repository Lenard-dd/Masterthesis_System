real_arm_safety:
  enabled: true
  execution_mode: full_grasp_supervised

  require_human_confirmation_each_motion: true
  confirmation_phrase: EXECUTE

  limits:
    max_cartesian_step_m: 0.08
    max_approach_distance_m: 0.06
    max_retreat_distance_m: 0.12
    max_lift_distance_m: 0.10
    # Pregrasp can start from observe/safe_home and therefore needs a larger
    # joint-space allowance than the short Cartesian approach/retreat stages.
    # Keep the latter constrained by their dedicated Cartesian distance limits.
    max_joint_delta_rad: 1.50
    max_total_joint_delta_rad: 3.00
    max_velocity_scale: 0.05
    max_acceleration_scale: 0.05
    min_planning_time_sec: 2.0

  allowed_real_motion_skills:
    - move_to_named_target
    - move_to_pregrasp
    - approach_grasp
    - retreat_grasp
    - lift_object
    - move_to_safe_home
    - move_to_observe

  blocked_real_motion_skills:
    - pick_object_direct
    - execute_pick_sequence_without_confirmation

  allowed_named_targets:
    - safe_home
    - observe

  grasp:
    require_detected_object: true
    require_base_link_pose: true
    require_grasp_plan: true
    require_min_grasp_score: true
    min_grasp_score: 0.60
    require_trajectory_review: true
    require_final_confirmation_each_step: true
    allow_contact_close: true
    allow_lift_after_close: true

  gripper:
    allow_real_gripper_during_grasp: true
    allow_open_gripper: true
    allow_set_width: true
    allow_close_gripper: true
    close_width_m: 0.0
    safe_close_width_m: 0.02
    max_force_N: 20.0
    max_speed_mps: 0.03
    contact_close_requires_confirmation: true
    confirmation_phrase: "YES"
