[metadata]
name = llm-skill-robot
version = 0.1.0
description = LLM-based skill composition and human-in-the-loop validation system for UR5 robot
author = Zhufeng Que
author_email = zhufeng.que@rwth-aachen.de
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pydantic>=2.0
    PyYAML>=6.0
    numpy>=1.21,<2
    Pillow>=9.0
include_package_data = True

[develop]
script_dir=$base/lib/llm_skill_robot

[install]
install_scripts=$base/lib/llm_skill_robot

[options.data_files]
share/ament_index/resource_index/packages =
    resource/llm_skill_robot
share/llm_skill_robot =
    package.xml
share/llm_skill_robot/config =
    config/*.yaml
share/llm_skill_robot/skills =
    skills/*.yaml
share/llm_skill_robot/scripts =
    scripts/*.py

[options.entry_points]
console_scripts =
    llm-skill-demo = llm_skill_robot.main_cli:main
    llm-plan-demo = llm_skill_robot.llm_plan_demo:main
    nl-plan-demo = llm_skill_robot.nl_plan_demo:main
    perception-demo = llm_skill_robot.perception_demo:main
    sam3-subprocess-single-image-test = llm_skill_robot.sam3_subprocess_single_image_test:main
    ros-get-ur5-state = llm_skill_robot.ros_get_ur5_state:main
    ros-check-real-arm = llm_skill_robot.ros_check_real_arm:main
    ros-real-arm-safe-motion-test = llm_skill_robot.ros_real_arm_safe_motion_test:main
    ros-check-gripper-model = llm_skill_robot.ros_check_gripper_model:main
    ros-check-real-gripper = llm_skill_robot.ros_check_real_gripper:main
    ros-real-gripper-test = llm_skill_robot.ros_real_gripper_test:main
    ros-graspgenx-gripper-width-test = llm_skill_robot.ros_graspgenx_gripper_width_test:main
    ros-graspgenx-plan-only-demo = llm_skill_robot.ros_graspgenx_plan_only_demo:main
    ros-graspgenx-pregrasp-real-demo = llm_skill_robot.ros_graspgenx_pregrasp_real_demo:main
    ros-pregrasp-gripper-real-test = llm_skill_robot.ros_pregrasp_gripper_real_test:main
    ros-restricted-real-hw-demo = llm_skill_robot.ros_restricted_real_hw_demo:main
    ros-full-grasp-supervised-demo = llm_skill_robot.ros_full_grasp_supervised_demo:main
    ros-llm-full-grasp-supervised-demo = llm_skill_robot.ros_llm_full_grasp_supervised_demo:main
    ros-tabletop-calibration = llm_skill_robot.ros_tabletop_calibration:main
    ros-hw-perception-gripper-demo = llm_skill_robot.ros_hw_perception_gripper_demo:main
    ros-gripper-rviz-demo = llm_skill_robot.ros_gripper_rviz_demo:main
    ros-d435i-sam3-demo = llm_skill_robot.ros_d435i_sam3_demo:main
    ros-llm-rviz-sim-demo = llm_skill_robot.ros_llm_rviz_sim_demo:main
    ros-nl-rviz-sim-demo = llm_skill_robot.ros_nl_rviz_sim_demo:main
    ros-rviz-sim-execution-demo = llm_skill_robot.ros_rviz_sim_execution_demo:main
    agent-runtime-demo = llm_skill_robot.agent_runtime_demo:main
    ros-agent-runtime-rviz-sim-demo = llm_skill_robot.ros_agent_runtime_rviz_sim_demo:main
