[metadata]
name = llm-skill-robot
version = 0.1.0
description = LLM-based skill composition and human-in-the-loop validation system for UR5 robot
author = DD
author_email = 
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pydantic>=2.0
    PyYAML>=6.0
include_package_data = True

[options.entry_points]
console_scripts =
    llm-skill-demo = llm_skill_robot.main_cli:main
    ros-get-ur5-state = llm_skill_robot.ros_get_ur5_state:main
