[metadata]
name = llm-skill-robot
version = 0.1.0
description = LLM-based skill composition and human-in-the-loop validation system for UR5 robot
author = DD
author_email = 
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pydantic>=2.0
    PyYAML>=6.0
include_package_data = True

[develop]
script_dir=$base/lib/llm_skill_robot

[install]
install_scripts=$base/lib/llm_skill_robot

[options.data_files]
share/ament_index/resource_index/packages =
    resource/llm_skill_robot
share/llm_skill_robot =
    package.xml

[options.entry_points]
console_scripts =
    llm-skill-demo = llm_skill_robot.main_cli:main
    ros-get-ur5-state = llm_skill_robot.ros_get_ur5_state:main
    ros-rviz-sim-execution-demo = llm_skill_robot.ros_rviz_sim_execution_demo:main
